plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'com.wraith.agent'
    compileSdk 34

    defaultConfig {
        applicationId 'com.wraith.agent'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0.0'

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

chaquopy {
    defaultConfig {
        version = "3.11"
        buildPython("/root/.local/share/uv/python/cpython-3.11-linux-aarch64-gnu/bin/python3.11")
    }
}
